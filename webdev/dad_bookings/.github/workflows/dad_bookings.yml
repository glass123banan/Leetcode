name: Run dad_bookings every day at 9 PM

on:
  schedule:
    - cron: '3 18 * * *'  # Runs daily at 21:00 UTC (adjust timezone if needed)

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install selenium webdriver-manager

    - name: Run dad_bookings.py
      env:
        EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        KTH_USERNAME: ${{ secrets.KTH_USERNAME }}
        KTH_PASSWORD: ${{ secrets.KTH_PASSWORD }}
      run: python dad_bookings.py